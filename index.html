<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // ── Cursor-style editorial system ──────────────────────────
            primary: "#f54e00",            // Cursor Orange — scarce CTA / accent
            "primary-active": "#d04200",
            "on-primary": "#ffffff",
            canvas: "#f7f7f4",             // warm cream page floor
            "canvas-soft": "#fafaf7",
            "surface-card": "#ffffff",
            "surface-strong": "#e6e5e0",
            hairline: "#e6e5e0",
            "hairline-soft": "#efeee8",
            "hairline-strong": "#cfcdc4",
            ink: "#26251e",                // warm near-black
            body: "#5a5852",
            muted: "#807d72",
            "muted-soft": "#a09c92",
            // AI-timeline pastels (signature — in-product agent stages)
            "tl-thinking": "#dfa88f",
            "tl-grep": "#9fc9a2",
            "tl-read": "#9fbbe0",
            "tl-edit": "#c0a8dd",
            "tl-done": "#c08532",
            success: "#1f8a65",
            error: "#cf2d56",
            // ── Legacy token names remapped to the new palette so existing
            //    components shift toward the editorial look automatically ──
            secondary: "#f54e00",
            background: "#f7f7f4",
            surface: "#ffffff",
            "surface-highlight": "#efeee8",
            border: "#e6e5e0",
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "Helvetica Neue", "Arial", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
          },
          borderRadius: {
            xs: "4px", sm: "6px", md: "8px", lg: "12px", xl: "16px",
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards',
            'slide-up': 'slideUp 0.8s cubic-bezier(0.32, 0.72, 0, 1) forwards',
            'pop-in': 'popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-in-right': 'slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'water-flow': 'waterFlow 3s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #f7f7f4;
      color: #26251e;
      font-family: "Inter", system-ui, sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #f7f7f4; }
    ::-webkit-scrollbar-thumb { background: #cfcdc4; border-radius: 9999px; border: 2px solid #f7f7f4; }
    ::-webkit-scrollbar-thumb:hover { background: #a09c92; }

    /* Editorial display utility — magazine voice, never bold */
    .display { font-weight: 400; letter-spacing: -0.03em; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes waterFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes shimmer { 0% { transform: translateX(-150%) skewX(-20deg); } 100% { transform: translateX(200%) skewX(-20deg); } }

    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
    .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
    .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-in-right { animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .delay-100 { animation-delay: 100ms; opacity: 0; animation-fill-mode: forwards; }
    .delay-200 { animation-delay: 200ms; opacity: 0; animation-fill-mode: forwards; }
    .delay-300 { animation-delay: 300ms; opacity: 0; animation-fill-mode: forwards; }
    .delay-400 { animation-delay: 400ms; opacity: 0; animation-fill-mode: forwards; }
    .delay-500 { animation-delay: 500ms; opacity: 0; animation-fill-mode: forwards; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
