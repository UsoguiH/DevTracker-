<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#D1F45F",
            secondary: "#FF9F45",
            background: "#050505",
            surface: "#121212",
            "surface-highlight": "#1E1E1E",
            border: "#262626",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards',
            'slide-up': 'slideUp 0.8s cubic-bezier(0.32, 0.72, 0, 1) forwards',
            'pop-in': 'popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-in-right': 'slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'water-flow': 'waterFlow 3s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #050505;
      color: #ffffff;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }

    /* Apple-like Smooth Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes waterFlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-150%) skewX(-20deg);
      }

      100% {
        transform: translateX(200%) skewX(-20deg);
      }
    }

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px);
      }
    }

    @keyframes slideRightIn {
      to {
        opacity: 1;
        filter: blur(0px);
        transform: translateX(0px);
      }
    }

    @keyframes testimonialIn {
      to {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px) scale(1);
      }
    }

    /* Utility classes for delays */
    .delay-100 {
      animation-delay: 100ms;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .delay-200 {
      animation-delay: 200ms;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .delay-300 {
      animation-delay: 300ms;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .delay-400 {
      animation-delay: 400ms;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .delay-500 {
      animation-delay: 500ms;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    /* Base animation classes */
    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    .animate-slide-up {
      animation: slideUp 0.8s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    .animate-pop-in {
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-slide-in-right {
      animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }


    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    @keyframes slideRightIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0px);
      }
    }

    @keyframes testimonialIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    /* Animation Utility Classes */
    .animate-element {
      animation: fadeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-slide-right {
      animation: slideRightIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-testimonial {
      animation: testimonialIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-delay-100 {
      animation-delay: 100ms;
    }

    .animate-delay-200 {
      animation-delay: 200ms;
    }

    .animate-delay-300 {
      animation-delay: 300ms;
    }

    .animate-delay-400 {
      animation-delay: 400ms;
    }

    .animate-delay-500 {
      animation-delay: 500ms;
    }

    .animate-delay-600 {
      animation-delay: 600ms;
    }

    .animate-delay-700 {
      animation-delay: 700ms;
    }

    .animate-delay-800 {
      animation-delay: 800ms;
    }

    .animate-delay-900 {
      animation-delay: 900ms;
    }

    .animate-delay-1000 {
      animation-delay: 1000ms;
    }

    .animate-delay-1200 {
      animation-delay: 1200ms;
    }

    .animate-delay-1400 {
      animation-delay: 1400ms;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
